[install]
saveTextLockfile = true

[test]
# tests/ indeholder Playwright E2E-specs — kør dem med: npx playwright test
# bun test køres kun på unit tests i src/
root = "src"
# Preload react-test-setup for React component tests (happy-dom + jest-dom matchers)
# Only .test.tsx files that import react-test-setup directly will activate this.
# react-test-setup (happy-dom + jest-dom) is NOT preloaded globally because it
# would break pure-unit tests that do not need a DOM. Each React test imports it
# explicitly at the top.
#
# test-preload is fetch-only (no DOM) and IS preloaded globally: it restores
# globalThis.fetch after every test so a fetch mock in one file cannot leak into
# another — order-dependent pollution that surfaced under CI's Linux file ordering.
preload = ["./src/testing/test-preload.ts"]
